# One-click deploy on Render: New > Blueprint > select this repo.
services:
  - type: web
    name: shopverse
    runtime: node
    plan: starter            # a persistent disk needs a paid plan; see README for the free option
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@shopverse.dev
      - key: ADMIN_PASSWORD
        sync: false          # you'll be asked for it when creating the blueprint
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DB_PATH
        value: /var/data/shopverse.db
    disk:
      name: shopverse-data
      mountPath: /var/data
      sizeGB: 1
