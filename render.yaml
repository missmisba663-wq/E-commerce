# One-click deploy on Render: New > Blueprint > select this repo.
# Free plan: the product catalogue is loaded during the build, so the site starts instantly.
# Accounts and orders live on the instance's temporary disk and reset on every restart or redeploy.
services:
  - type: web
    name: shopverse
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@shopverse.dev
      - key: ADMIN_PASSWORD
        sync: false          # you'll be asked for it when creating the blueprint
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
