# Render blueprint: one web service that serves the API and the built React app.
# autoDeploy is off on purpose. GitHub Actions triggers deploys, and only once the tests have passed.
services:
  - type: web
    name: fernleaf
    runtime: node
    plan: free
    autoDeploy: false
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
